<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha · Monitor Cirúrgico</title>
<style>
  body{font-family:'Space Grotesk',Arial,sans-serif;background:linear-gradient(135deg,#eaf6ee,#e3f3f7);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
  .box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,0.08)}
  h1{font-size:1.15rem;margin:0 0 6px;color:#0a2a35}
  p{font-size:0.85rem;color:#5a7480;margin:0 0 20px}
  label{font-size:0.78rem;font-weight:600;color:#0a2a35;display:block;margin-bottom:4px}
  input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:9px;border:1px solid rgba(135,195,150,0.4);font-size:0.95rem;margin-bottom:14px}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#4bb4d2,#87c396);color:#fff;font-weight:700;font-size:0.95rem;cursor:pointer}
  button:disabled{opacity:0.6;cursor:not-allowed}
  .msg{font-size:0.8rem;margin-top:12px;padding:10px;border-radius:8px}
  .err{background:rgba(217,79,79,0.08);color:#d94f4f}
  .ok{background:rgba(5,150,105,0.1);color:#059669}
</style>
</head>
<body>
<div class="box">
  <h1>Definir nova senha</h1>
  <p id="sub">Digite sua nova senha de acesso ao Monitor Cirúrgico.</p>
  <form id="form" onsubmit="return false">
    <label>Nova senha</label>
    <input type="password" id="pass1" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    <label>Confirmar senha</label>
    <input type="password" id="pass2" placeholder="Repita a senha" autocomplete="new-password">
    <button id="btn" onclick="salvar()">Salvar nova senha</button>
  </form>
  <div id="msg" class="msg" style="display:none"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.0";

  const supabase = createClient(
    "https://rqzqetfoxiutabsooqqn.supabase.co",
    "sb_publishable_P3EggMdsxQUoKnX_pLMaRQ_ZrGEYpIP"
  );
  window._supabaseReset = supabase;

  const msgEl = document.getElementById('msg');
  function showMsg(text, ok) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
    msgEl.style.display = 'block';
  }

  // O link de reset chega com o token na URL; o supabase-js processa
  // automaticamente e dispara este evento quando a sessão de recuperação
  // está pronta para aceitar updateUser({ password }).
  let recoveryReady = false;
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
  });

  window.salvar = async function() {
    const p1 = document.getElementById('pass1').value;
    const p2 = document.getElementById('pass2').value;
    const btn = document.getElementById('btn');
    if (p1.length < 6) { showMsg('A senha deve ter ao menos 6 caracteres.', false); return; }
    if (p1 !== p2) { showMsg('As senhas não coincidem.', false); return; }
    btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      const { error } = await supabase.auth.updateUser({ password: p1 });
      if (error) throw error;
      showMsg('Senha definida com sucesso! Redirecionando para o login…', true);
      setTimeout(() => { window.location.href = 'index.html'; }, 1800);
    } catch (e) {
      showMsg('Erro ao salvar: ' + (e.message || 'tente abrir o link novamente.'), false);
      btn.disabled = false; btn.textContent = 'Salvar nova senha';
    }
  };
</script>
</body>
</html>
